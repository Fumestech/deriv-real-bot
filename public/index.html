<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Deriv Trading Bot</title>
  <link rel="stylesheet" href="/style.css">
</head>

<body>
  <main class="container">
    <header>
      <h1>Deriv Trading Bot</h1>
      <span id="auth" class="badge">Not logged in</span>
    </header>

    <section class="card">
      <h2>Account</h2>

      <button id="login" class="primary">
        Login with Deriv
      </button>

      <label>Deriv Account ID</label>
      <input id="account" type="text" placeholder="Enter account ID">

      <label>Account type</label>
      <select id="accountType">
        <option value="demo">Demo</option>
        <option value="real">Real</option>
      </select>

      <label class="check">
        <input id="liveConfirm" type="checkbox">
        I understand that Real mode uses real money
      </label>
    </section>

    <section class="card">
      <h2>Strategy</h2>

      <label>Market</label>
      <select id="symbol">
        <option value="1HZ100V">Volatility 100 (1s)</option>
        <option value="1HZ75V">Volatility 75 (1s)</option>
        <option value="1HZ50V">Volatility 50 (1s)</option>
        <option value="1HZ25V">Volatility 25 (1s)</option>
      </select>

      <label>Stake (USD)</label>
      <input id="stake" type="number" value="1" min="0.35" step="0.01">

      <label>Duration (seconds)</label>
      <input id="duration" type="number" value="60" min="5">

      <label>Fast EMA</label>
      <input id="fast" type="number" value="9" min="2">

      <label>Slow EMA</label>
      <input id="slow" type="number" value="21" min="3">

      <label>RSI Period</label>
      <input id="rsi" type="number" value="14" min="2">

      <label>RSI Trigger</label>
      <input id="trigger" type="number" value="55" min="50" max="90">
    </section>

    <section class="card">
      <h2>Risk Controls</h2>

      <label>Maximum daily loss (USD)</label>
      <input id="maxLoss" type="number" value="10" min="0">

      <label>Maximum trades per day</label>
      <input id="maxTrades" type="number" value="10" min="1">

      <label class="check">
        <input id="auto" type="checkbox">
        Automatic entries
      </label>
    </section>

    <section class="card">
      <h2>Market</h2>

      <div class="market">
        <div>
          <small>Price</small>
          <strong id="price">—</strong>
        </div>

        <div>
          <small>Signal</small>
          <strong id="signal">WAIT</strong>
        </div>
      </div>
    </section>

    <section class="actions">
      <button id="start" class="primary">
        Connect & Start
      </button>

      <button id="stop" class="danger">
        Stop Bot
      </button>
    </section>

    <section class="card">
      <h2>Positions / Activity</h2>
      <div id="log" class="log">
        <div>Waiting for connection...</div>
      </div>
    </section>

    <footer>
      <p>
        ⚠️ Trading involves financial risk. Test with a Deriv demo account
        before considering real trading.
      </p>
    </footer>
  </main>

  <script src="/app.js"></script>
</body>
        </html>
